name: Build latest precompiled package

on:
  workflow_dispatch:

jobs:
  format-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Format new release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'latest'
          name: "Latest precompiled packages"
          body: |
            For
            - Windows Server 2012
            - Windows Server 2012 R2
            - Windows 8.1
          prerelease: false

  build:
    runs-on: ubuntu-latest
    needs: format-release
    permissions:
      contents: write
    strategy:
      matrix:
        buildtarget: ['27']
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        run: |
          _NAME="go-midori-blue-1.${{ matrix.buildtarget }}-$GOOS-$GOARCH"
          echo "SOURCE PACKET GOVER: 1.${{ matrix.buildtarget }}"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: 'release-branch.go1.${{ matrix.buildtarget }}'
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        run: |
          cd ./go
          patch --verbose -p 1 < ../patch/go-1-${{ matrix.buildtarget }}.diff
          cd ..

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go/src/go.mod'
          check-latest: true

      - name: Build patched Go
        shell: bash
        run: |
          cd ./go/src
          . ./make.bash "$@" --no-banner
          ../bin/go tool dist banner
          cd ../..

      - name: Copy binaries into bin
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        shell: bash
        run: |
          cd ./go/bin
          DIR="${GOOS}_${GOARCH}"
          if [ -d "${DIR}" ]; then
            echo "Found ${DIR} copying binaries"
            rm ./go*
            for BINARY in "${DIR}"/*
            do
              echo "mv ./${BINARY} ./"
              mv ./${BINARY} ./
            done
            rm -r ./"${DIR}"
            rm -r ../pkg/tool/linux_amd64/
          fi
          cd ..
          ls -al ./bin
          cd ..

      - name: Copy License
        run: |
          cp -f ./patch/LICENSE ./go/

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        shell: bash
        run: |
          cd ./go/
          zip -9vr ./${{ env.ASSET_NAME }}.zip . -x "./.*" "./.*/*" "./**/.*" "./**/.*/*" "./**/*_test.go" "./**/testdata"
          cd ../

      - name: Compute hashes for file
        run: |
          cd ./go/
          FILE=./${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
          cd ../

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/${{ env.ASSET_NAME }}.zip*
          tag: latest
          file_glob: true
